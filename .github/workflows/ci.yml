name: TeX
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-latex-recommended texlive-pictures texlive-luatex texlive-xetex texlive-fonts-recommended texlive-extra-utils
      - name: Regression tests
        run: l3build check
      - name: Invalid-input diagnostics
        run: python3 scripts/check_invalid_options.py
      - name: Check CTAN archive
        run: l3build ctan
      - name: Compile manual
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error derham.tex
          pdflatex -interaction=nonstopmode -halt-on-error derham.tex
      - name: Compile examples
        run: |
          for f in examples/*.tex; do pdflatex -interaction=nonstopmode -halt-on-error "$f"; done
